<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Canada AI Strategy Chatbot</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <aside id="agentPanel" class="agent-panel">
      <div class="agent-panel-header">
        <div>
          <div class="agent-panel-title">Agent Activity</div>
          <div class="agent-panel-subtitle">Reasoning and tool trace</div>
        </div>
        <button id="closeAgentPanel" class="icon-btn" type="button" aria-label="Close agent panel">×</button>
      </div>
      <div id="agentLog" class="agent-log"></div>
    </aside>

    <main class="main-panel">
      <header class="topbar">
        <div class="topbar-left">
          <button id="toggleAgentPanel" class="topbar-btn" type="button">Logs</button>
          <div class="brand-wrap">
            <div class="brand-title">Canada AI Strategy Chatbot</div>
            <div id="status" class="status-pill">Idle</div>
          </div>
        </div>
        <div class="topbar-right">
          <a href="settings.html" class="topbar-link">Settings</a>
        </div>
      </header>

      <section id="chatList" class="chat-list">
        <div class="welcome-block">
          <h1>Ask about Canada’s AI Strategy</h1>
          <p>Ask something about Canada’s AI strategy, policy, market, or related research.</p>
        </div>
      </section>

      <div class="composer-wrap">
        <div class="composer">
          <textarea id="userText" placeholder="Message Canada AI Strategy Chatbot..." rows="1"></textarea>
          <div class="composer-actions">
            <div class="composer-left">
              <button id="stopBtn" class="ghost-btn" type="button">Stop Audio</button>
              <button id="clearBtn" class="ghost-btn" type="button">Clear</button>
            </div>
            <button id="sendBtn" class="send-btn" type="button" aria-label="Send message">➤</button>
          </div>
        </div>
        <div class="composer-hint">Enter to send, Shift + Enter for a new line</div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
